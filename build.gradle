import java.nio.file.Files
import java.nio.file.Path
import org.gradle.api.GradleException
import org.gradle.api.publish.maven.tasks.PublishToMavenLocal
import org.gradle.api.tasks.testing.TestDescriptor
import org.gradle.api.tasks.testing.TestListener
import org.gradle.api.tasks.testing.TestResult

buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    constraints {
      classpath('org.eclipse.jgit:org.eclipse.jgit:6.10.1.202505221210-r') {
        because 'mitigate JGit CVEs while staying on pure-Java JGit (no git CLI in graalvm-dev)'
      }
      classpath('com.google.guava:guava:33.8.0-jre') {
        because 'mitigate Guava CVEs pulled by git-version 1.0.0'
      }
    }
  }
}

plugins {
  id 'scala'
  id 'java-library'
  id 'maven-publish'
  id 'compiler.native-image'
  id 'com.gradleup.shadow' version '9.6.1'
  id 'com.palantir.git-version' version '1.0.0'
}

ext {
  scala_maj = '3'
  scala_ver = "${scala_maj}.9.0"
  scala_test = '3.2.20'
}

def rawGitVersion = file('.git').exists() ? gitVersion() : '0.0.0-bootstrap'
def isDirtyGitTree = rawGitVersion.endsWith('.dirty')
def normalizedGitVersion = rawGitVersion.replaceFirst(/^v(?=\d)/, '')
def publishVersionOverride = providers.gradleProperty('publishVersion').orNull?.trim()

group = 'com.scalarometer'
version = (publishVersionOverride && !publishVersionOverride.isEmpty()) ? publishVersionOverride : normalizedGitVersion

repositories {
  mavenCentral()
}

configurations {
  replCompiler
}

dependencies {
  api "org.scala-lang:scala${scala_maj}-library_${scala_maj}:${scala_ver}"
  replCompiler "org.scala-lang:scala${scala_maj}-compiler_${scala_maj}:${scala_ver}"

  testImplementation "org.scalatest:scalatest_${scala_maj}:${scala_test}"
  testImplementation "org.scalactic:scalactic_${scala_maj}:${scala_test}"

  testImplementation 'junit:junit:4.13.2'
  testImplementation "org.scalatestplus:junit-4-13_${scala_maj}:${scala_test}.0"
}

java {
  withSourcesJar()
}

processResources {
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
  exclude '**/*.sample'
}

def enableTestReports = providers.gradleProperty('testReports').map { it.toBoolean() }.orElse(false)

test {
  useJUnit()
  minHeapSize = '128m'
  maxHeapSize = '512m'
  jvmArgs '--sun-misc-unsafe-memory-access=allow', '-XX:+UseCompactObjectHeaders'
  reports {
    html.required = enableTestReports
    junitXml.required = enableTestReports
  }
  testLogging {
    events 'passed', 'skipped', 'failed'
    showStandardStreams = false
    exceptionFormat = 'full'
  }
  addTestListener(new TestListener() {
    void beforeSuite(TestDescriptor suite) {}
    void afterSuite(TestDescriptor suite, TestResult result) {
      if (suite.parent == null) {
        println "\nTest result: ${result.resultType}"
        println "Tests: ${result.testCount}, succeeded: ${result.successfulTestCount}, failed: ${result.failedTestCount}, skipped: ${result.skippedTestCount}"
        println "Time: ${(result.endTime - result.startTime) / 1000.0} s"
      }
    }
    void beforeTest(TestDescriptor testDescriptor) {}
    void afterTest(TestDescriptor testDescriptor) {}
  })
}

tasks.register('repl', JavaExec) {
  group = 'application'
  description = 'Starts a Scala 3 REPL with the library runtime classpath'
  mainClass = 'dotty.tools.repl.Main'
  classpath = sourceSets.main.runtimeClasspath + configurations.replCompiler
  standardInput = System.in
  args '-usejavacp'
}

tasks.register('resolveDependencies') {
  group = 'build setup'
  description = 'Resolves compile, runtime, and test classpaths (excluding replCompiler) for offline and container layer priming'
  doLast {
    ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].each { cfgName ->
      configurations.named(cfgName).get().resolve()
    }
  }
}

tasks.withType(AbstractArchiveTask).configureEach {
  preserveFileTimestamps = false
  reproducibleFileOrder = true
}

jar {
  manifest {
    attributes(
      'App-Version': version,
      'Implementation-Version': version
    )
  }
}

shadowJar {
  archiveClassifier = 'all'
  manifest {
    attributes(
      'App-Version': version,
      'Implementation-Version': version
    )
  }
  exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/maven/**'
  mergeServiceFiles()
}

def publishedArtifactId = "${project.name}_${scala_maj}"
def resolvedGroup = project.group.toString()
def resolvedVersion = project.version.toString()

components.java.withVariantsFromConfiguration(configurations.shadowRuntimeElements) {
  skip()
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      artifactId = publishedArtifactId
      from components.java
      pom {
        name = 'Scalarometer'
        description = 'Lightweight, thread-safe Scala 3 LTS metrics and telemetry library for JVM and GraalVM Native Image'
        url = 'https://github.com/bdina/scalarometer'
        licenses {
          license {
            name = 'MIT License'
            url = 'https://opensource.org/licenses/MIT'
          }
        }
        scm {
          connection = 'scm:git:git://github.com/bdina/scalarometer.git'
          developerConnection = 'scm:git:ssh://github.com/bdina/scalarometer.git'
          url = 'https://github.com/bdina/scalarometer'
        }
      }
    }
  }
}

def allowDirtyPublish = providers.gradleProperty('allowDirtyPublish').map { it.toBoolean() }.orElse(false)

tasks.withType(PublishToMavenLocal).configureEach {
  doFirst {
    if ((resolvedVersion.endsWith('.dirty') || isDirtyGitTree) && !allowDirtyPublish.get()) {
      throw new GradleException(
        "Refusing to publish dirty version '${resolvedVersion}' (gitVersion='${rawGitVersion}') to Maven Local. " +
        "Commit or stash changes first, or pass -PallowDirtyPublish=true to override."
      )
    }
  }
  doLast {
    def m2RepoPath = System.getProperty('maven.repo.local') ?: "${System.getProperty('user.home')}/.m2/repository"
    def m2Repo = Path.of(m2RepoPath)
    def groupSegments = resolvedGroup.split('\\.')
    def artifactDir = m2Repo.resolve(groupSegments.join('/')).resolve(publishedArtifactId)

    def hostUidStr = System.getenv('HOST_UID')
    def hostGidStr = System.getenv('HOST_GID')
    if (hostUidStr?.isInteger() && hostGidStr?.isInteger() && Files.exists(artifactDir)) {
      int hostUid = hostUidStr.toInteger()
      int hostGid = hostGidStr.toInteger()
      try {
        Path walkDir = m2Repo
        for (String seg : groupSegments) {
          walkDir = walkDir.resolve(seg)
          if (Files.exists(walkDir) && Files.getAttribute(walkDir, 'unix:uid') == 0) {
            Files.setAttribute(walkDir, 'unix:uid', hostUid)
            Files.setAttribute(walkDir, 'unix:gid', hostGid)
          }
        }
        Files.walk(artifactDir).withCloseable { stream ->
          stream.forEach { Path p ->
            Files.setAttribute(p, 'unix:uid', hostUid)
            Files.setAttribute(p, 'unix:gid', hostGid)
          }
        }
      } catch (UnsupportedOperationException ignored) {
        // Non-POSIX filesystem; skip ownership adjustment.
      }
    }

    logger.lifecycle("Published ${resolvedGroup}:${publishedArtifactId}:${resolvedVersion} to ${m2Repo}")
  }
}

tasks.withType(JavaCompile).configureEach {
  options.release = 17
}

def scalaCompilerParams = [
    '-feature'
  , '-no-indent'
  , '-explain'
  , '-language:noAutoTupling'
  , '-language:strictEquality'
  , '-opt'
  , '-opt-inline:com.scalarometer.statistics.**'
  , '-Werror'
  , '-Wnonunit-statement'
  , '-Wsafe-init'
  , '-Wunused:all'
  , '-Wvalue-discard'
  , '-release:17'
]

tasks.withType(org.gradle.api.tasks.scala.ScalaCompile).configureEach {
  scalaCompileOptions.deprecation = true
  scalaCompileOptions.additionalParameters = scalaCompilerParams
  scalaCompileOptions.forkOptions.with {
    memoryInitialSize = '256m'
    memoryMaximumSize = '1536m'
    jvmArgs = [
      '-XX:+UseParallelGC',
      '-XX:+UseCompactObjectHeaders',
      '-XX:TieredStopAtLevel=1'
    ]
  }
}

tasks.named('compileTestScala').configure {
  scalaCompileOptions.additionalParameters = scalaCompilerParams.findAll {
    it != '-Wnonunit-statement' &&
      it != '-Wvalue-discard' &&
      it != '-language:strictEquality' &&
      it != '-opt' &&
      !it.startsWith('-opt-inline:')
  }
}
