name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check script syntax
        run: bash -n scripts/docker-build && bash -n docker-build-test.sh && bash -n docker-publish-local.sh && bash -n scripts/verify-maven-local
      - name: Cache Gradle dependencies and Zinc bridge
        uses: actions/cache@v4
        with:
          path: |
            .gradle-docker/caches/modules-2
            .gradle-docker/caches/jars-*
            .gradle-docker/caches/zinc-*
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties', 'buildSrc/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Build toolchain image (GraalVM + Gradle)
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build -t graalvm-dev:latest -f docker/ci-toolchain.Dockerfile .
      - name: Build and test
        env:
          MEMORY: 6gb
        run: ./scripts/docker-build gradle --no-daemon --no-build-cache test jar sourcesJar shadowJar --warning-mode all
      - name: Verify clean artifact versioning
        run: |
          ls -la build/libs/scalarometer-*.jar
          if compgen -G "build/libs/*.dirty*.jar" > /dev/null; then
            echo "ERROR: dirty JAR artifacts detected" >&2
            exit 1
          fi
      - name: Verify local Maven publish and downstream consumption
        env:
          MEMORY: 6gb
        run: ./scripts/verify-maven-local
      - uses: actions/upload-artifact@v4
        with:
          name: scalarometer-jars
          path: build/libs/scalarometer-*.jar
          if-no-files-found: error
